name: "Download ECS Task Definition"
description: "Download ECS task definition JSON from a GitHub repo via API"
inputs:
  github-token:
    description: "PAT or token with access to the private repo"
    required: true
  taskdef-url:
    description: "GitHub API URL to the file
    required: true
  output:
    description: "Output filename"
    required: false
    default: "task-definition.json"
  preview-lines:
    description: "How many lines to preview"
    required: false
    default: "13"
runs:
  using: "composite"
  steps:
    - name: Download task definition
      shell: bash
      run: |
        set -euo pipefail
        echo "--- Downloading task definition:"
        echo "${{ inputs.taskdef-url }}"
        curl -H "Authorization: token ${{ inputs.github-token }}" \
             -H "Accept: application/vnd.github.v3.raw" \
             -L "${{ inputs.taskdef-url }}" \
             -o "${{ inputs.output }}"
        echo "✓ Downloaded: ${{ inputs.output }}"
        ls -la "${{ inputs.output }}"
        echo "--- Content preview:"
        head -n "${{ inputs.preview-lines }}" "${{ inputs.output }}"
